# [!IMPORTANT] Human review needed — AI-generated, unreviewed. See AI_POLICY.md.
#
# Build the Vue website (website/) and deploy it to GitHub Pages.
#
# NOTE: GitHub only runs workflows from the repo-root .github/workflows, so this
# lives here rather than under website/. The `paths:` filter keeps it scoped to
# the website subtree — Swift-daemon changes never trigger a Pages deploy.
name: website-pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website-pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install (frozen lockfile, honors the release-age policy)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
